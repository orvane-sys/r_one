# CPU-only default: works on any machine with Docker, no GPU or NVIDIA toolkit needed.
#   docker compose up
# NVIDIA GPU:   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
# Live source:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  r_one:
    build:
      context: .
      dockerfile: Dockerfile
    image: r_one:latest
    container_name: r_one_perception
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - TURTLEBOT3_MODEL=waffle
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: ros2 launch r_one spatial_scene.launch.py
