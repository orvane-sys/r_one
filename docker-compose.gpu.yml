# NVIDIA GPU override. Needs the NVIDIA Container Toolkit on the host.
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
services:
  r_one:
    build:
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu126
    image: r_one:gpu
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
