name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: shellcheck -S warning r_one/scripts/*.sh docker/entrypoint.sh

  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The ROS desktop-full image plus PyTorch is large; free runner disk first
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h /

      - uses: docker/setup-buildx-action@v3

      # Builds with package.xml-driven rosdep, requirements.txt, and the CPU torch wheel.
      # The Dockerfile itself fails if numpy/cv_bridge/ultralytics cannot import together.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: r_one:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run colcon tests (unit, launch integration, lint)
        run: |
          docker run --rm -e ROS_LOCALHOST_ONLY=1 r_one:ci bash -c '
            colcon test --event-handlers console_direct+ &&
            colcon test-result --verbose &&
            ament_flake8 src/r_one/tools'
